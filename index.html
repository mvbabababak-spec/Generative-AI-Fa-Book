<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="هوش مصنوعی">
  <title>هوش مصنوعی مولد برای مبتدیان — کتاب آموزشی</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/images/original/ai-computervision.png">
  <link rel="apple-touch-icon" href="assets/images/original/ai-computervision.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app">
  <div id="top-progress" class="top-progress" style="display:none"><div class="top-progress-bar"></div></div>

  <section id="screen-home" class="screen active">
    <div class="home-cover">
      <div class="home-cover-bg"></div>
      <div class="home-cover-content">
        <div class="home-cover-badge">📚 کتاب آموزشی فارسی</div>
        <h1 class="home-cover-title">هوش مصنوعی مولد<br>برای مبتدیان</h1>
        <p class="home-cover-subtitle">۲۱ درس آموزشی — ترجمه فارسی</p>
        <div class="home-cover-actions">
          <button class="btn-primary" id="btn-continue" onclick="App.continueReading()"><span class="btn-icon">📖</span> ادامه خواندن</button>
          <button class="btn-secondary" onclick="App.scrollToContent()"><span class="btn-icon">☰</span> فهرست محتوا</button>
        </div>
        <div class="home-cover-stats" id="home-stats"></div>
      </div>
    </div>
    <div class="home-content" id="home-chapters"></div>
  </section>

  <section id="screen-reader" class="screen">
    <header class="reader-header">
      <button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="reader-header-title"><span class="reader-chapter-icon" id="reader-icon"></span><span id="reader-title">...</span></div>
      <button class="icon-btn" onclick="App.toggleBookmark()"><svg id="bookmark-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    </header>
    <div class="reader-body" id="reader-body"><article class="reader-content" id="reader-content"></article><nav class="reader-nav" id="reader-nav"></nav></div>
    <footer class="reader-footer">
      <button class="footer-btn" onclick="App.prevSection()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>قبل</button>
      <div class="footer-progress"><div class="footer-progress-bar" id="footer-progress"></div></div>
      <button class="footer-btn" onclick="App.nextSection()">بعد<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    </footer>
  </section>

  <section id="screen-search" class="screen">
    <header class="search-header">
      <button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <input type="search" id="search-input" placeholder="جستجو در کتاب..." autocomplete="off">
      <button class="icon-btn" onclick="App.clearSearch()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></button>
    </header>
    <div class="search-results" id="search-results"></div>
  </section>

  <section id="screen-bookmarks" class="screen">
    <header class="sub-header"><button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h2>علامت‌گذاری‌ها</h2></header>
    <div class="sub-content" id="bookmarks-list"></div>
  </section>

  <section id="screen-notes" class="screen">
    <header class="sub-header"><button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h2>یادداشت‌های شخصی</h2></header>
    <div class="sub-content" id="notes-list"></div>
  </section>

  <section id="screen-settings" class="screen">
    <header class="sub-header"><button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h2>تنظیمات</h2></header>
    <div class="sub-content" id="settings-content"></div>
  </section>

  <section id="screen-progress" class="screen">
    <header class="sub-header"><button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h2>پرورش خواندن</h2></header>
    <div class="sub-content" id="progress-content"></div>
  </section>

  <section id="screen-quiz" class="screen">
    <header class="sub-header"><button class="icon-btn" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h2>آزمون‌ها</h2></header>
    <div class="sub-content" id="quiz-content"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home" onclick="App.goHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>خانه</span></button>
    <button class="nav-item" data-screen="progress" onclick="App.showScreen('progress')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>پرورش</span></button>
    <button class="nav-item" data-screen="search" onclick="App.showScreen('search')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span>جستجو</span></button>
    <button class="nav-item" data-screen="bookmarks" onclick="App.showScreen('bookmarks')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>علامت</span></button>
    <button class="nav-item" data-screen="settings" onclick="App.showScreen('settings')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>تنظیمات</span></button>
  </nav>
</div>
<script src="assets/js/book-data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
